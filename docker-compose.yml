services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studioflow
      POSTGRES_USER: studioflow
      POSTGRES_PASSWORD: studioflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - studioflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studioflow -d studioflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build: ./StudioFlow
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${API_DATABASE:-studioflow};Username=studioflow;Password=studioflow"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-}"
      Seed__DemoClientPassword: "${SEED_DEMO_CLIENT_PASSWORD:-}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  studioflow_pgdata:
