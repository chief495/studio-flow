services:
  test-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: studioflow_test
      POSTGRES_PASSWORD: studioflow_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studioflow_test -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 20
