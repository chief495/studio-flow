<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudioFlow</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header><div class="brand">Studio<span>Flow</span></div><div id="userBar"></div></header>
  <main>
    <section id="authView" class="panel">
      <h1>Бронируйте студию<br>без лишних звонков.</h1><p>Мини-сервис для репетиционных и звукозаписывающих студий.</p>
      <div class="grid" style="margin-top:28px">
        <form id="loginForm"><h2>Войти</h2><label>Email</label><input id="loginEmail" type="email" required><label>Пароль</label><input id="loginPassword" type="password" required><button>Войти</button><p>Нет аккаунта? <button type="button" class="secondary" id="showRegister">Зарегистрироваться</button></p></form>
        <form id="registerForm" class="hidden"><h2>Регистрация</h2><label>Email</label><input id="registerEmail" type="email" required><label>Пароль</label><input id="registerPassword" type="password" minlength="8" required><label>Tenant ID (GUID)</label><input id="tenantId" required placeholder="например, 00000000-0000-0000-0000-000000000001"><button>Создать аккаунт</button><p>Уже есть аккаунт? <button type="button" class="secondary" id="showLogin">Войти</button></p></form>
      </div><div id="authMessage" class="notice hidden"></div>
    </section>
    <section id="appView" class="hidden">
      <div class="hero"><div><h1>Добро пожаловать</h1><p id="tenantInfo"></p></div><div class="actions"><a href="/swagger" target="_blank"><button class="secondary">Swagger API</button></a><button id="logout" class="secondary">Выйти</button></div></div>
      <div id="adminPanel" class="panel hidden" style="margin-bottom:20px"><h2>Добавить комнату</h2><form id="roomForm" class="actions"><input id="roomName" placeholder="Название комнаты" required style="max-width:260px;margin:0"><input id="roomCapacity" type="number" min="1" placeholder="Вместимость" required style="max-width:150px;margin:0"><button>Добавить</button></form></div>
      <h2>Доступные комнаты</h2><div id="rooms" class="grid"></div><div id="message" class="notice hidden"></div>
      <h2 style="margin-top:34px">Мои бронирования</h2><div id="bookings"></div>
    </section>
      <section id="slotsPanel" class="panel hidden"><h2>Свободные слоты (UTC)</h2><input id="slotDate" type="date"><div id="slots" class="actions"></div></section>
  </main>
  <script src="/js/app.js" defer></script>
</body>
</html>
